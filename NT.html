<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #111111;
      font-family: Inter, system-ui, sans-serif;
    }
    main { width: min(500px, calc(100vw - 40px)); text-align: center; }
    h1 { margin: 0 0 32px; font-size: 32px; font-weight: 600; }
    form {
      display: flex;
      width: 100%;
      gap: 10px;
      padding: 14px 18px;
      border: 1px solid #dddddd;
      border-radius: 12px;
      background: #ffffff;
    }
    input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #111111;
      font: inherit;
    }
    button {
      flex: 0 0 auto;
      padding: 6px 12px;
      border: 1px solid #dddddd;
      border-radius: 8px;
      background: #111111;
      color: #ffffff;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #333333; }
  </style>
</head>
<body>
  <main>
    <h1>Search</h1>
    <form id="searchForm">
      <input id="searchInput" type="text" placeholder="Search the web..." autocomplete="off" autofocus>
      <button type="submit">Enter</button>
    </form>
  </main>
  <script>
    document.getElementById('searchForm').addEventListener('submit', event => {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      if (query) {
        window.parent.postMessage({
          type: 'navigate',
          url: 'https://search.brave.com/search?q=' + encodeURIComponent(query)
        }, '*');
      }
    });
  </script>
</body>
</html>
